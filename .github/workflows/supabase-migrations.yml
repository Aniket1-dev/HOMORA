name: HOMORA Supabase migrations

on:
  push:
    branches: [supabase]
    paths:
      - 'supabase/migrations/**'

concurrency:
  group: homora-supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy-migrations:
    # Enable only after SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and
    # SUPABASE_PROJECT_REF are configured in GitHub Actions secrets.
    if: ${{ vars.HOMORA_SUPABASE_MIGRATIONS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Apply committed migrations
        run: supabase db push --linked --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
