name: HOMORA Supabase backend deployment

on:
  push:
    branches: [supabase]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'

concurrency:
  group: homora-supabase-production-backend
  cancel-in-progress: false

jobs:
  deploy-backend:
    # Enable only after SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and
    # SUPABASE_PROJECT_REF are configured in GitHub Actions secrets.
    if: ${{ vars.HOMORA_SUPABASE_MIGRATIONS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Apply committed database migrations
        run: supabase db push --linked --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy Admin and Partner Edge Functions
        run: |
          supabase functions deploy admin-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy partner-team --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
